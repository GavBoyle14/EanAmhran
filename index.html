<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ean - Irish and World Bird Sounds</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0e0e0c;--parchment:#f4f0e8;--sage:#5a7a5c;--moss:#3a5a3c;
  --gold:#b8954a;--clay:#c4785a;--muted:#8a9a8c;
  --border:rgba(90,122,92,0.18);--shadow:rgba(14,14,12,0.1);
}
html,body{height:100%;overflow:hidden;background:var(--parchment)}
body{color:var(--ink);font-family:'DM Sans',sans-serif;
  display:flex;flex-direction:column;align-items:center;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 35% at 50% 0%,rgba(184,149,74,0.09),transparent 60%),
             radial-gradient(ellipse 60% 40% at 100% 100%,rgba(90,122,92,0.07),transparent 60%)}
.app{position:relative;z-index:1;width:100%;max-width:440px;height:100%;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,4px)}
header{flex-shrink:0;padding:14px 20px 0;display:flex;flex-direction:column;align-items:center}
.logo-row{display:flex;align-items:center;gap:9px;margin-bottom:1px}
.logo-feather{font-size:1.5rem;filter:drop-shadow(0 2px 8px rgba(184,149,74,.45));animation:fdrift 5s ease-in-out infinite}
@keyframes fdrift{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;letter-spacing:.12em;color:var(--moss);line-height:1}
h1 span{font-style:italic;font-weight:400;color:var(--gold)}
.tagline{font-size:.6rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.divider{width:100%;height:1px;margin:10px 0 8px;background:linear-gradient(to right,transparent,var(--border),var(--gold),var(--border),transparent)}
.tabs{flex-shrink:0;display:flex;margin:0 14px 8px;border-bottom:2px solid var(--border)}
.tab{flex:1;padding:7px 4px 9px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;letter-spacing:.04em;color:var(--muted);cursor:pointer;position:relative;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tab::after{content:'';position:absolute;bottom:-2px;left:10%;right:10%;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .22s;border-radius:2px}
.tab.active{color:var(--moss);font-weight:600}
.tab.active::after{transform:scaleX(1)}
.counterbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px 6px;font-size:.67rem;color:var(--muted);letter-spacing:.05em}
.cbadge{font-size:.58rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--moss);color:#fff;border-radius:4px;padding:2px 7px}
.counterbar b{color:var(--sage);font-weight:700}
.viewport{flex:1;position:relative;overflow:hidden;margin:0 12px;min-height:0;border-radius:18px;box-shadow:0 6px 32px var(--shadow),0 1px 6px rgba(0,0,0,.05)}
.bird-card{position:absolute;inset:0;background:#fff;border-radius:18px;overflow:hidden;will-change:transform;display:flex;flex-direction:column}
.out-l{animation:outL .27s cubic-bezier(.4,0,1,1) both}
.out-r{animation:outR .27s cubic-bezier(.4,0,1,1) both}
.in-r{animation:inR .32s cubic-bezier(0,0,.2,1) both}
.in-l{animation:inL .32s cubic-bezier(0,0,.2,1) both}
@keyframes outL{to{transform:translateX(-108%);opacity:0}}
@keyframes outR{to{transform:translateX(108%);opacity:0}}
@keyframes inR{from{transform:translateX(108%);opacity:0}}
@keyframes inL{from{transform:translateX(-108%);opacity:0}}
.card-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.card-scroll::-webkit-scrollbar{display:none}
.photo-wrap{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;flex-shrink:0;background:linear-gradient(160deg,#c8d8c0,#9ab89a)}
.photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.photo-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#d4e4cc,#b0c8b0)}
.big-emoji{font-size:5rem}
.ph-label{font-size:.62rem;letter-spacing:.1em;color:var(--sage);text-transform:uppercase;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.photo-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:55px;background:linear-gradient(to top,#fff,transparent);pointer-events:none}
.bird-info{padding:12px 18px 14px}
.bird-name{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;line-height:1.1;color:var(--ink)}
.bird-latin{font-family:'Cormorant Garamond',serif;font-size:.9rem;font-style:italic;font-weight:300;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:.58rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:3px 8px}
.tag-sound{background:rgba(90,122,92,.1);color:var(--sage);border:1px solid rgba(90,122,92,.22)}
.tag-irish{background:rgba(184,149,74,.1);color:var(--gold);border:1px solid rgba(184,149,74,.28)}
.tag-world{background:rgba(122,168,184,.1);color:#5a8898;border:1px solid rgba(122,168,184,.3)}
.bird-desc{font-size:.83rem;line-height:1.7;color:#4e4e46;margin-top:12px}
.audio-section{flex-shrink:0;border-top:1px solid var(--border);background:rgba(248,245,240,.97);padding:10px 14px 14px}
.audio-meta{font-size:.64rem;color:var(--muted);text-align:center;margin-bottom:8px;min-height:15px;letter-spacing:.03em}
.audio-meta.ok{color:var(--sage)}.audio-meta.err{color:var(--clay)}
audio{display:block;width:100%;height:44px;border-radius:8px;accent-color:var(--moss)}
.nav{flex-shrink:0;display:flex;align-items:center;padding:8px 14px 10px;gap:10px}
.nav-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--border);background:rgba(255,255,255,.85);color:var(--moss);font-size:1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .14s;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 8px var(--shadow)}
.nav-btn:active{background:var(--moss);color:#fff;transform:scale(.92)}
.nav-btn:disabled{opacity:.18;cursor:default;pointer-events:none}
.dots{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;max-height:22px;overflow:hidden}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(90,122,92,.16);transition:all .2s;flex-shrink:0}
.dot.near{background:rgba(90,122,92,.32)}
.dot.active{background:var(--gold);transform:scale(1.6);box-shadow:0 0 5px rgba(184,149,74,.45)}
.credit{flex-shrink:0;text-align:center;font-size:.57rem;color:var(--muted);padding:1px 16px 6px;letter-spacing:.03em}
.credit a{color:var(--sage);text-decoration:none}
.splash{position:fixed;inset:0;z-index:200;background:var(--moss);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:splashOut 0s 1.8s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.splash-bird{font-size:3rem;animation:fdrift 2s ease-in-out infinite}
.splash-title{font-family:'Cormorant Garamond',serif;font-size:3.4rem;font-weight:300;color:var(--parchment);letter-spacing:.14em}
.splash-title em{font-style:italic;color:var(--gold)}
.splash-sub{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,240,232,.4);margin-top:4px}
</style>
</head>
<body>
<div class="splash">
  <div class="splash-bird">&#x1FAB6;</div>
  <div class="splash-title"><em>Ean</em></div>
  <div class="splash-sub">Irish &amp; World Bird Sounds</div>
</div>
<div class="app">
  <header>
    <div class="logo-row">
      <span class="logo-feather">&#x1FAB6;</span>
      <h1>E<span>an</span></h1>
    </div>
    <p class="tagline">Irish &amp; World Bird Sounds</p>
    <div class="divider"></div>
  </header>
  <div class="tabs">
    <button class="tab active" id="tab-irish" onclick="switchTab('irish')">&#127470;&#127466; Irish Birds</button>
    <button class="tab" id="tab-international" onclick="switchTab('international')">&#127757; World Birds</button>
  </div>
  <div class="counterbar">
    <span class="cbadge" id="cbadge">Ireland</span>
    <span>Bird <b id="cN">1</b> of <b id="cT">1</b></span>
    <span style="font-size:.62rem;color:var(--muted)">&lt; swipe &gt;</span>
  </div>
  <div class="viewport" id="viewport">
    <div class="bird-card" id="card">
      <div class="card-scroll" id="cardScroll">
        <div class="photo-wrap" id="photoWrap">
          <div class="photo-placeholder">
            <span class="big-emoji">&#128038;</span>

        <div class="bird-info">
          <div class="bird-name" id="bName">-</div>
          <div class="bird-latin" id="bLatin"></div>

            <span class="tag" id="bCatTag"></span>
          </div>
          <div class="bird-desc" id="bDesc"></div>
        </div>
      </div>
      <div class="audio-section">
        <div class="audio-meta ok" id="aMeta">Tap below to hear this bird</div>
        <audio id="audioPlayer" preload="none"></audio>
        <button id="playBtn" onclick="playAudio()" style="display:flex;align-items:center;justify-content:center;gap:10px;background:#3a5a3c;color:white;border-radius:12px;padding:13px;border:none;width:100%;font-family:DM Sans,sans-serif;font-size:0.9rem;font-weight:600;margin-top:4px;cursor:pointer;">
          &#9654; Play Bird Sound
        </button>
      </div>
    </div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">&#9664;</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">&#9654;</button>
  </div>
  <p class="credit">Created by <strong style="color:var(--sage)">Gavin</strong> &nbsp;-&nbsp;
    Sounds: <a href="https://commons.wikimedia.org" target="_blank">Wikimedia Commons</a> &nbsp;-&nbsp;
    Images: <a href="https://wikipedia.org" target="_blank">Wikipedia</a></p>
</div>

var currentTab = 'irish', currentList = BIRDS.irish, currentIdx = 0, isBusy = false, currentAudio = '';

// Swipe detection
(function() {
  var vp = document.getElementById('viewport');
  var startX = 0, startY = 0;
  vp.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, {passive: true});
  vp.addEventListener('touchmove', function(e) {
    if (Math.abs(e.touches[0].clientX - startX) > Math.abs(e.touches[0].clientY - startY)) e.preventDefault();
  }, {passive: false});
  vp.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = Math.abs(e.changedTouches[0].clientY - startY);
    if (Math.abs(dx) > 50 && dy < 80) go(dx < 0 ? 1 : -1);
  });
})();

function go(dir) {
  if (isBusy) return;
  var ni = currentIdx + dir;
  if (ni < 0 || ni >= currentList.length) return;
  isBusy = true;
  var card = document.getElementById('card');
  card.classList.add(dir > 0 ? 'out-l' : 'out-r');
  card.addEventListener('animationend', function onOut() {
    card.removeEventListener('animationend', onOut);
    currentIdx = ni;
    card.className = 'bird-card';
    renderBird();
    var inCls = dir > 0 ? 'in-r' : 'in-l';
    card.classList.add(inCls);
    card.addEventListener('animationend', function onIn() {
      card.removeEventListener('animationend', onIn);
      card.classList.remove(inCls);
      isBusy = false;
    }, {once: true});
  }, {once: true});
}

function switchTab(t) {
  if (t === currentTab) return;
  currentTab = t; currentList = BIRDS[t]; currentIdx = 0;
  document.getElementById('tab-irish').classList.toggle('active', t === 'irish');
  document.getElementById('tab-international').classList.toggle('active', t === 'international');
  document.getElementById('cbadge').textContent = t === 'irish' ? 'Ireland' : 'World';
  document.getElementById('card').className = 'bird-card';
  renderBird(); buildDots();
}

function renderBird() {
  var b = currentList[currentIdx];
  var cs = document.getElementById('cardScroll');
  if (cs) cs.scrollTop = 0;
  document.getElementById('bName').textContent = b.n;
  document.getElementById('bLatin').textContent = b.l;
  document.getElementById('bSoundTag').textContent = '>> ' + b.s;
  document.getElementById('bDesc').textContent = b.d;
  var ct = document.getElementById('bCatTag');
  ct.innerHTML = b.cat === 'ireland' ? '&#127470;&#127466; Irish' : '&#127757; World';
  ct.className = 'tag ' + (b.cat === 'ireland' ? 'tag-irish' : 'tag-world');
  document.getElementById('cN').textContent = currentIdx + 1;
  document.getElementById('cT').textContent = currentList.length;
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  document.getElementById('nextBtn').disabled = currentIdx === currentList.length - 1;
  updateDots();

  // Photo from Wikipedia
  var pw = document.getElementById('photoWrap');
  pw.innerHTML = '<div class="photo-placeholder"><span class="big-emoji">&#128038;</span><span class="ph-label">Loading...</span></div>';
  var wikiName = b.wiki, bName = b.n;
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(wikiName))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (document.getElementById('bName').textContent !== bName) return;
      var src = (d.originalimage && d.originalimage.source) || (d.thumbnail && d.thumbnail.source);
      if (src) {
        var img = document.createElement('img');
        img.src = src; img.alt = bName;
        document.getElementById('photoWrap').innerHTML = '';
        document.getElementById('photoWrap').appendChild(img);
      }
    }).catch(function() {});

  // Audio: get the audio file Wikipedia's own article uses for this species.
  // The media-list API only returns files that actually exist on Wikimedia right now –
  // so the URL is always valid, unlike the hardcoded OGG URLs in the bird data.
  currentAudio = b.audio; // stale OGG as last-resort while fetch is in flight
  var player = document.getElementById('audioPlayer');
  var btn = document.getElementById('playBtn');
  var meta = document.getElementById('aMeta');
  if (player) { player.pause(); player.removeAttribute('src'); player.load(); }
  if (btn) { btn.innerHTML = '&#9654; Play Bird Sound'; btn.style.background = '#3a5a3c'; }
  if (meta) { meta.className = 'audio-meta ok'; meta.textContent = 'Finding sound\u2026'; }
  var _bName = b.n, _bWiki = b.wiki;
  fetch('https://en.wikipedia.org/api/rest_v1/page/media-list/' + encodeURIComponent(_bWiki))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (document.getElementById('bName').textContent !== _bName) return;
      var found = null;
      if (d.items) {
        for (var i = 0; i < d.items.length; i++) {
          var item = d.items[i];
          if (item.type !== 'audio' || !item.original || !item.original.source) continue;
          // skip spoken-word pronunciation clips (En-us-birdname.oga etc)
          var fname = item.original.source.split('/').pop().toLowerCase();
          if (/^en-|^spoken|pron/.test(fname)) continue;
          found = item.original.source; break;
        }
      }
      if (found) currentAudio = found;
      var m2 = document.getElementById('aMeta');
      if (m2 && document.getElementById('bName').textContent === _bName) {
        m2.className = 'audio-meta ok';
        m2.textContent = found ? 'Tap play to hear this bird' : 'Tap play (sound may be unavailable)';
      }
    })
    .catch(function() {
      var m2 = document.getElementById('aMeta');
      if (m2 && document.getElementById('bName').textContent === _bName) {
        m2.className = 'audio-meta ok'; m2.textContent = 'Tap play to hear this bird';
      }
    });
}


// Wikimedia Commons auto-transcodes OGG to MP3 at a predictable URL.
// MP3 is supported everywhere (including iOS Safari); OGG is not.
function wikiOggToMp3(url) {
  var m = url && url.match(/\/commons\/([a-f0-9]\/[a-f0-9]{2}\/)([^/]+\.ogg)$/i);
  return m ? 'https://upload.wikimedia.org/wikipedia/commons/transcoded/' + m[1] + m[2] + '/' + m[2] + '.mp3' : null;
}

function playAudio() {
  var player = document.getElementById('audioPlayer');
  var btn = document.getElementById('playBtn');
  var meta = document.getElementById('aMeta');
  if (!player || !currentAudio) return;

  if (player.paused) {
    if (meta) { meta.className = 'audio-meta ok'; meta.textContent = 'Loading…'; }
    var mp3 = wikiOggToMp3(currentAudio);
    // Try MP3 first (works on iOS Safari + all others); fall back to original OGG
    player.src = mp3 || currentAudio;
    player.play()
      .catch(function() {
        if (mp3) { player.src = currentAudio; return player.play(); }
        return Promise.reject();
      })
      .then(function() {
        if (btn) { btn.innerHTML = '&#9646;&#9646; Pause'; btn.style.background = '#c4785a'; }
        if (meta) { meta.className = 'audio-meta ok'; meta.textContent = 'Now playing…'; }
      })
      .catch(function(e) {
        var msg = 'Could not load audio';
        if (e && e.name) msg += ' (' + e.name + ')';
        if (meta) { meta.className = 'audio-meta err'; meta.textContent = msg; }
      });
  } else {
    player.pause();
    if (btn) { btn.innerHTML = '&#9654; Play Bird Sound'; btn.style.background = '#3a5a3c'; }
    if (meta) { meta.className = 'audio-meta ok'; meta.textContent = 'Tap play to hear this bird'; }
  }

  player.onended = function() {
    if (btn) { btn.innerHTML = '&#9654; Play Bird Sound'; btn.style.background = '#3a5a3c'; }
    if (meta) { meta.className = 'audio-meta ok'; meta.textContent = 'Tap play to hear this bird'; }
  };
}

function buildDots() {
  var w = document.getElementById('dots'); w.innerHTML = '';
  var n = Math.min(currentList.length, 44);
  for (var i = 0; i < n; i++) { var d = document.createElement('div'); d.className = 'dot'; w.appendChild(d); }
  updateDots();
}

function updateDots() {
  var dots = document.getElementById('dots').querySelectorAll('.dot');
  if (!dots.length) return;
  var n = dots.length, total = currentList.length;
  var active = Math.round((currentIdx / Math.max(total - 1, 1)) * (n - 1));
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = 'dot';
    if (i === active) dots[i].classList.add('active');
    else if (Math.abs(i - active) <= 1) dots[i].classList.add('near');
  }
}

window.addEventListener('load', function() { renderBird(); buildDots(); });
</script>
